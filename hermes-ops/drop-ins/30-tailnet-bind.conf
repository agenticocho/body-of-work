[Service]
ExecStart=
# `dashboard`, not `serve`: serve is the headless backend and answers every page
# with "web UI disabled", so the browser gets JSON instead of the SPA. Keep the
# tailnet bind address here so the Tailscale proxy at 443 can reach it.
ExecStart=/home/chilly1/.local/bin/hermes dashboard --host <TAILNET-IP-THIS-BOX> --port 9119 --skip-build --no-open